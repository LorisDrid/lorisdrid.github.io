    <style>
@keyframes color-shift {
  0%, 100% {
    color: #4f46e5;
  }
  50% {
    color: #6366f1;
  }
}

.title-hover {
  transition: transform 0.3s ease-in-out, color 0.5s ease-out;
  text-shadow: 1px 1px 1px rgba(0, 17, 18, 0.5);
}

.title-hover:hover {
  animation: color-shift 3s ease-in-out infinite;
  transform: scale(1.05);
}

.switch {
  position: relative;
  display: inline-block;
  width: 52px;
  height: 28px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: transform 0.4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 5px;
  bottom: 4px;
  transition: 0.4s;
  background-image: url('/icons/theme.svg');
  background-repeat: no-repeat;
  background-size: 200% 100%;
  background-position: left center;
  border-radius: 50%;
}

.slider:hover {
  outline: #6366f1 solid 2px;
  transition: outline .1s;
}

input:checked + .slider {
  background-color: var(--block-bg-dark);
}

input:checked + .slider:before {
  transform: translateX(24px);
  background-position: right center;
  filter: invert(1);
}
</style>

  <script>
    const htmlClass = document.documentElement.classList;
    const darkScheme = window.matchMedia("(prefers-color-scheme: dark)");
    const themeToggle = document.getElementById("theme-toggle");

    const setDark = (isDark) => {
      if (isDark) {
        htmlClass.add("dark");
        document.body.dispatchEvent(new CustomEvent("set-theme", { detail: "dark" }));
      } else {
        htmlClass.remove("dark");
        document.body.dispatchEvent(new CustomEvent("set-theme", { detail: "light" }));
      }
      localStorage.setItem("dark", isDark);
      themeToggle.checked = isDark;
    };

    setTimeout(() => htmlClass.remove("not-ready"), 10);
    const stored = localStorage.getItem("dark");
    const prefersDark = stored ? stored === "true" : darkScheme.matches;
    setDark(prefersDark);

    darkScheme.addEventListener("change", (e) => {
      const stored = localStorage.getItem("dark");
      if (stored === null) setDark(e.matches);
    });

    themeToggle.addEventListener("change", () => {
      setDark(themeToggle.checked);
    });

    const btnMenu = document.querySelector(".btn-menu");
    btnMenu?.addEventListener("click", () => htmlClass.toggle("open"));

    // Close the mobile menu after navigating
    document.querySelectorAll(".site-nav-mobile a").forEach((a) =>
      a.addEventListener("click", () => htmlClass.remove("open"))
    );
  </script>
